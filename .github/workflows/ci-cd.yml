name: CookMate CI/CD

on:
  push:
    branches:
      - develope
      - main

  pull_request:
    branches:
      - develope
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build


  backend:
    name: Backend Build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build backend
        run: ./gradlew clean bootJar --no-daemon -x test


  deploy:
    name: Deploy to NAS

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - frontend
      - backend

    runs-on:
      - self-hosted
      - Linux
      - X64
      - cookmate-nas

    concurrency:
      group: cookmate-production
      cancel-in-progress: false

    steps:
      - name: Deploy CookMate
        run: sudo -n /usr/local/sbin/deploy-cookmate.sh
